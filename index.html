<!DOCTYPE html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Richtprijs calculator | Energie De Kempen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap">
<style>
  @font-face{font-family:"EDK Gill";font-weight:400;font-display:swap;src:url("https://energiedekempen.be/wp-content/uploads/breakdance/fonts/Gill_Sans.woff2") format("woff2")}
  @font-face{font-family:"EDK Gill";font-weight:600;font-display:swap;src:url("https://energiedekempen.be/wp-content/uploads/breakdance/fonts/GillSans_SemiBold_05.woff2") format("woff2")}
  @font-face{font-family:"EDK Cond";font-weight:700;font-display:swap;src:url("https://energiedekempen.be/wp-content/uploads/breakdance/fonts/HelveticaNeueCondensedBold.woff2") format("woff2")}
  :root{
    --teal:#07A8A3; --teal-dark:#058a86; --teal-soft:rgba(115,198,194,.18); --teal-line:rgba(115,198,194,.67);
    --ink:#000; --muted:#797979; --line:#e2e2e2; --bg:#f7f7f7; --card:#fff;
    --body:"EDK Gill","Gill Sans","Gill Sans MT",Calibri,"Segoe UI",sans-serif;
    --head:"EDK Cond","Helvetica Neue Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--body);color:var(--ink);background:var(--bg);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:24px 14px 40px}
  .card{background:var(--card);border-radius:22px;box-shadow:0 14px 34px -20px rgba(0,0,0,.25);overflow:hidden}
  .top{background:var(--teal);color:#fff;padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .top img{height:46px;width:auto;display:block}
  .brand-txt{font-family:var(--head);font-weight:700;font-size:24px;letter-spacing:.2px;display:none}
  .top .tag{font-family:var(--head);font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.6px;opacity:.95;text-align:right}
  .progress{padding:16px 28px 0}
  .progress .meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
  .bar{height:6px;background:#eee;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .4s ease}
  .body{padding:26px 28px 30px}
  h1,h2{font-family:var(--head);font-weight:700;margin:0 0 6px;line-height:1.1}
  h2{font-size:30px}
  .sub{color:var(--muted);margin:0 0 22px}
  .opts{display:grid;gap:12px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opts.three{grid-template-columns:repeat(3,1fr)}
  .rooms{display:grid;gap:12px}
  .rooms .row{display:flex;align-items:center;gap:14px}
  .rooms .row b{flex:0 0 90px;font-weight:600}
  .rooms .row .inp{flex:1}
  .opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 18px;border:2px solid var(--line);border-radius:16px;background:#fff;transition:border-color .15s,background .15s,transform .15s}
  .opt:hover{border-color:var(--teal-line);transform:translateY(-1px)}
  .opt:focus-visible{outline:3px solid var(--teal-soft)}
  .opt.sel{border-color:var(--teal);background:var(--teal-soft)}
  .opt .ic{flex:0 0 44px;height:44px;border-radius:12px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center}
  .opt.sel .ic{background:var(--teal);color:#fff}
  .opt .t{font-weight:600;font-size:17px;display:block}
  .opt .d{color:var(--muted);font-size:14.5px;display:block}
  .opt .chk{margin-left:auto;flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
  .opt.sel .chk{background:var(--teal);border-color:var(--teal);color:#fff}
  .big .opt{flex-direction:column;align-items:flex-start;padding:22px}
  .big .opt .ic{width:56px;height:56px;flex-basis:auto}
  .big .opt .chk{display:none}
  .big .opt{position:relative}
  label.f{display:block;font-weight:600;margin:4px 0 8px}
  .inp{position:relative}
  .inp input{width:100%;font:inherit;font-size:20px;padding:14px 70px 14px 16px;border:2px solid var(--line);border-radius:14px;outline:none;background:#fff}
  .inp input:focus{border-color:var(--teal)}
  .inp span{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
  .hint{color:var(--muted);font-size:14.5px;margin:8px 0 0}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{all:unset;cursor:pointer;padding:8px 14px;border:2px solid var(--line);border-radius:99px;font-size:15px;background:#fff}
  .chip:hover{border-color:var(--teal-line)}
  .chip.sel{border-color:var(--teal);background:var(--teal-soft)}
  input[type=range]{width:100%;margin-top:18px;accent-color:var(--teal)}
  .rangemeta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px}
  .btn{all:unset;box-sizing:border-box;cursor:pointer;font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-size:16px;padding:13px 26px;border-radius:9999px;background:var(--teal);color:#fff;text-align:center;transition:background .15s}
  .btn:hover{background:var(--teal-dark)}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink);padding-left:4px;padding-right:4px}
  .btn.ghost:hover{color:var(--teal)}
  .result{text-align:center;padding:8px 0}
  .result .lbl{font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--teal);font-size:15px}
  .result .price{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.05;margin:10px 0 6px}
  .result .spec{color:var(--muted);font-size:17px}
  .pricebox{border:2px solid var(--teal);background:var(--teal-soft);border-radius:20px;padding:28px 18px;margin:18px 0 14px}
  .small{color:var(--muted);font-size:13.5px;text-align:center;margin:0}
  .hidden{display:none!important}
  @media (max-width:560px){
    .opts.two,.opts.three{grid-template-columns:1fr}
    .grid2{grid-template-columns:1fr}
    h2{font-size:25px}
    .top{padding:18px 18px}.body{padding:22px 18px 26px}.progress{padding:14px 18px 0}
    .top img{height:38px}.top .tag{font-size:11.5px}
    .result .price{font-size:36px}
    .nav{flex-direction:column-reverse;align-items:stretch}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top">
      <img id="logo" src="https://energiedekempen.be/wp-content/uploads/2025/01/b671bda9b07a6548154927720ac520d4-1.png" alt="Energie De Kempen" onerror="this.style.display='none';document.getElementById('brandTxt').style.display='block'">
      <div class="brand-txt" id="brandTxt">Energie De Kempen</div>
      <div class="tag">Bereken je richtprijs</div>
    </div>
    <div class="progress hidden" id="progress">
      <div class="meta"><span id="stepTxt">Stap 1 van 4</span><span id="pctTxt">25%</span></div>
      <div class="bar"><i id="barFill" style="width:25%"></i></div>
    </div>
    <div class="body" id="view"></div>
  </div>
</div>

<script>
/* ===================== PRIJSINSTELLINGEN =====================
   Pas hier de prijzen aan. Bedragen in euro, incl. installatie.  */
const SOLAR_PRICES = [ // per totaal vermogen (Wp)
  {maxWp:4000, low:3048, high:3566},
  {maxWp:5000, low:3566, high:4119},
  {maxWp:6000, low:4119, high:4810},
  {maxWp:7000, low:4810, high:5790},
  {maxWp:8000, low:5790, high:6412}
];
const BATTERY_PRICES = { 5:{low:2166,high:3325}, 10:{low:3824,high:5341}, 15:{low:5482,high:7357} };
const AIRCO_PRICES = { // per ruimte/binnenunit
  single:{low:1200, high:1800},            // 1 ruimte: single-split per ruimte
  multiBase:{low:1500, high:2500},         // multi-split: buitenunit
  multiPerRoom:{low:800, high:1400}        // multi-split: per binnenunit
};
const AIRCO_W_PER_M2 = {slecht:150, gemiddeld:120, goed:100, uitstekend:80};
const PANEL_WP = 450, PANEL_M2 = 1.7, KWH_PER_KWP = 950, EUR_PER_KWH = 0.30;
/* ============================================================= */

const ICONS = {
  sun:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  battery:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M10 2h4M13 8l-3 5h4l-3 5"/></svg>',
  roof:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 12 12 4l9 8M5 10v10h14V10"/></svg>',
  flat:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8h18M5 8v12h14V8"/></svg>',
  combo:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 13 8 7l6 6M4 11v9h16v-8h-6"/></svg>',
  compass:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>',
  plug:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/></svg>',
  meter:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h3"/></svg>',
  goal:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
  no:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="m8 8 8 8"/></svg>',
  snow:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M4.9 7l14.2 10M4.9 17 19.1 7M9 4l3 2 3-2M9 20l3-2 3 2"/></svg>',
  check:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>'
};

const state = { product:null, step:0, solar:{roof:null,orient:null,surface:40,mode:null,kwh:null,eur:null,gezin:null}, bat:{kwh:null,solar:null,panels:null,wp:400,meter:null,phase:null,goal:null}, airco:{count:null,rooms:[],iso:null,heat:null} };
const SOLAR_STEPS = ['roof','orient','surface','usage'];
const BAT_STEPS = ['bkwh','bsolar','bmeter','bphase','bgoal'];
const AIRCO_STEPS = ['acount','arooms','aiso','aheat'];
const steps = () => state.product==='solar' ? SOLAR_STEPS : state.product==='airco' ? AIRCO_STEPS : BAT_STEPS;
const eur = n => '€ ' + Math.round(n).toLocaleString('nl-BE');
const $ = s => document.querySelector(s);

/* ---------- Rekenlogica zonnepanelen ---------- */
const ORIENT = {zuid:1,'zo-zw':.9,'oost-west':.75,noord:.5,onbekend:.85};
function solarConsumption(s){
  if(s.mode==='kwh' && s.kwh) return s.kwh;
  if(s.mode==='eur' && s.eur) return Math.round(s.eur/EUR_PER_KWH);
  if(s.mode==='gezin' && s.gezin) return {'1-2':2500,'3-4':3500,'5+':5000}[s.gezin];
  return 3500;
}
function solarPriceForWp(wp){
  if(!(wp>0)) return null;
  if(wp<2500||wp>8000){ const ref=wp<2500?2500:8000, row=wp<2500?SOLAR_PRICES[0]:SOLAR_PRICES[SOLAR_PRICES.length-1];
    return {low:Math.round(row.low*wp/ref), high:Math.round(row.high*wp/ref)}; }
  return SOLAR_PRICES.find(r=>wp<=r.maxWp);
}
function calcSolar(s){
  const f = ORIENT[s.orient] ?? .85;
  const perPanel = PANEL_WP/1000*KWH_PER_KWP*f;
  const need = Math.max(1, Math.ceil(solarConsumption(s)/perPanel));
  const fit = Math.floor(s.surface/PANEL_M2);
  const panels = Math.max(1, Math.min(fit, need));
  const wp = panels*PANEL_WP;
  return {panels, kwp:wp/1000, price:solarPriceForWp(wp)};
}

/* ---------- Rekenlogica thuisbatterij ---------- */
const BATTERIES = [
  {id:'basic-5',cap:5,power:2.5},{id:'basic-10',cap:10,power:5},{id:'basic-15',cap:15,power:5},
  {id:'smart-5',cap:5,power:3.5},{id:'smart-10',cap:10,power:5},{id:'smart-15',cap:15,power:7.5},
  {id:'smart-10-backup',cap:10,power:8},{id:'smart-15-backup',cap:15,power:11}
];
function calcBattery(b){
  const use = b.kwh || 3500, hasSolar = b.solar===true, kwp = hasSolar ? (b.panels||0)*(b.wp||400)/1000 : 0;
  const backup = b.goal==='backup' || b.goal==='all', daily = use/365;
  let min, max;
  if(hasSolar){ min=Math.max(5,Math.round(kwp*.8)); max=Math.min(20,Math.round(kwp*1.5)); }
  else { min=Math.max(5,Math.round(daily*.5)); max=Math.max(10,Math.round(daily)); }
  if(backup){ min=Math.max(min,10); max=Math.max(max,15); }
  const mid = Math.round((min+max)/2);
  const inRange = x => x.cap>=min*.6 && x.cap<=max*1.5;
  const phaseOk = x => !(b.phase==='three' && x.power<5);
  let list = BATTERIES.filter(x => phaseOk(x) && (backup ? x.id.includes('backup') && inRange(x) : !x.id.includes('backup') && inRange(x)));
  if(!list.length && backup) list = BATTERIES.filter(x => phaseOk(x) && inRange(x));
  list.sort((a,c)=>{ if(backup){const ab=a.id.includes('backup'),cb=c.id.includes('backup'); if(ab&&!cb)return -1; if(!ab&&cb)return 1;} return Math.abs(a.cap-mid)-Math.abs(c.cap-mid); });
  const pick = list.find(x=>x.cap>=min && x.cap<=max) || list[0];
  const cap = pick ? pick.cap : (mid<=7.5?5:mid<=12.5?10:15);
  return {cap, price:BATTERY_PRICES[cap], backup};
}

/* ---------- Rekenlogica airco ---------- */
const r50 = n => Math.round(n/50)*50;
function calcAirco(a){
  const n = a.rooms.length || 1;
  const m2 = a.rooms.reduce((t,r)=>t+(r||0),0);
  const kw = Math.ceil(m2*(AIRCO_W_PER_M2[a.iso]||120)/1000*10)/10;
  let low, high, spec;
  if(n>=2){
    low = r50(AIRCO_PRICES.multiBase.low + AIRCO_PRICES.multiPerRoom.low*n);
    high = r50(AIRCO_PRICES.multiBase.high + AIRCO_PRICES.multiPerRoom.high*n);
    spec = `Multi-split · 1 buitenunit + ${n} binnenunits · ${kw.toLocaleString('nl-BE')} kW`;
  } else {
    low = r50(AIRCO_PRICES.single.low); high = r50(AIRCO_PRICES.single.high);
    spec = `Single-split · 1 binnenunit · ${kw.toLocaleString('nl-BE')} kW`;
  }
  return {price:{low,high}, spec};
}

/* ---------- UI helpers ---------- */
function opt(key,val,title,desc,icon,sel){
  return `<button type="button" class="opt${sel?' sel':''}" data-k="${key}" data-v="${val}">
    ${icon?`<span class="ic">${ICONS[icon]}</span>`:''}
    <span><span class="t">${title}</span>${desc?`<span class="d">${desc}</span>`:''}</span>
    <span class="chk">${sel?ICONS.check:''}</span></button>`;
}
function chip(key,val,label,sel){ return `<button type="button" class="chip${sel?' sel':''}" data-k="${key}" data-v="${val}">${label}</button>`; }
function numInput(id,val,unit,ph,min,max,step){
  return `<div class="inp"><input id="${id}" type="number" inputmode="numeric" value="${val??''}" placeholder="${ph}" min="${min}" max="${max}" step="${step}"><span>${unit}</span></div>`;
}
function nav(canNext,label){
  return `<div class="nav"><button type="button" class="btn ghost" id="back">← Terug</button>
    <button type="button" class="btn" id="next" ${canNext?'':'disabled'}>${label||'Volgende'}</button></div>`;
}
function setProgress(){
  const p=$('#progress');
  if(!state.product || state.step>=steps().length){ p.classList.add('hidden'); return; }
  p.classList.remove('hidden');
  const total=steps().length+1, cur=state.step+2, pct=Math.round(cur/total*100);
  $('#stepTxt').textContent=`Stap ${cur} van ${total}`; $('#pctTxt').textContent=pct+'%'; $('#barFill').style.width=pct+'%';
}

/* ---------- Validatie per stap ---------- */
function valid(){
  const s=state.solar,b=state.bat;
  switch(steps()[state.step]){
    case 'roof': return !!s.roof;
    case 'orient': return !!s.orient;
    case 'surface': return s.surface>=10;
    case 'usage': return s.mode==='kwh'?s.kwh>0 : s.mode==='eur'?s.eur>0 : s.mode==='gezin'?!!s.gezin : false;
    case 'bkwh': return b.kwh>=1000;
    case 'bsolar': return b.solar===false || (b.solar===true && b.panels>=4 && b.wp>=200);
    case 'bmeter': return b.meter!==null;
    case 'bphase': return !!b.phase;
    case 'bgoal': return !!b.goal;
    case 'acount': return state.airco.rooms.length>0;
    case 'arooms': return state.airco.rooms.length>0 && state.airco.rooms.every(r=>r>=5);
    case 'aiso': return !!state.airco.iso;
    case 'aheat': return state.airco.heat!==null;
  }
  return false;
}

/* ---------- Schermen ---------- */
function render(){
  setProgress();
  const v=$('#view'), s=state.solar, b=state.bat;
  if(!state.product){
    v.innerHTML = `<h2>Waarvoor wil je een richtprijs?</h2><p class="sub">Beantwoord een paar korte vragen en je ziet meteen je richtprijs.</p>
      <div class="opts three big">
        ${opt('product','solar','Zonnepanelen','Richtprijs voor een installatie op jouw dak','sun',false)}
        ${opt('product','battery','Thuisbatterij','Richtprijs voor een batterij op maat van je verbruik','battery',false)}
        ${opt('product','airco','Airco','Richtprijs voor koelen en verwarmen per ruimte','snow',false)}
      </div>`;
    return bind();
  }
  const key = steps()[state.step];
  const last = state.step===steps().length-1;
  const lbl = last ? 'Bereken richtprijs' : 'Volgende';
  let h='';
  switch(key){
    case 'roof':
      h=`<h2>Welk type dak heb je?</h2><p class="sub">Kies het dak waar de panelen op komen.</p><div class="opts">
        ${opt('roof','hellend','Hellend dak','','roof',s.roof==='hellend')}
        ${opt('roof','plat','Plat dak','','flat',s.roof==='plat')}
        ${opt('roof','combi','Combinatie','Deels hellend, deels plat','combo',s.roof==='combi')}</div>`; break;
    case 'orient':
      h=`<h2>Hoe is je dak georiënteerd?</h2><p class="sub">De richting waar je dakvlak naartoe kijkt.</p><div class="opts two">
        ${[['zuid','Zuid'],['zo-zw','Zuidoost / Zuidwest'],['oost-west','Oost / West'],['noord','Noord'],['onbekend','Weet ik niet']].map(([k,t])=>opt('orient',k,t,'','compass',s.orient===k)).join('')}</div>`; break;
    case 'surface':
      h=`<h2>Hoeveel vrije dakoppervlakte heb je?</h2><p class="sub">Zonder schouw, dakramen of andere obstakels.</p>
        <label class="f">Dakoppervlakte</label>${numInput('surface',s.surface,'m²','40',10,500,5)}
        <input type="range" id="surfaceRange" min="10" max="150" step="1" value="${Math.min(150,s.surface||10)}">
        <div class="rangemeta"><span>10 m²</span><span id="panelsFit">± ${Math.floor((s.surface||0)/PANEL_M2)} panelen mogelijk</span><span>150 m²</span></div>
        <div class="chips">${[['Klein',15],['Gemiddeld',30],['Groot',60],['Zeer groot',100]].map(([t,n])=>chip('surface',n,`${t} (${n} m²)`,s.surface===n)).join('')}</div>
        <p class="hint">Gemiddeld: rijwoning 30–50 m², halfopen 50–80 m², vrijstaand 80–120 m².</p>`; break;
    case 'usage':
      h=`<h2>Wat is je jaarlijks stroomverbruik?</h2><p class="sub">Kies wat voor jou het makkelijkst is.</p><div class="opts">
        ${opt('mode','kwh','Ik ken mijn verbruik in kWh','Staat op je jaarafrekening','meter',s.mode==='kwh')}
        ${opt('mode','eur','Ik ken enkel mijn jaarfactuur','In euro','plug',s.mode==='eur')}
        ${opt('mode','gezin','Ik weet het niet','We schatten op basis van je gezin','goal',s.mode==='gezin')}</div>
        <div style="margin-top:20px">
        ${s.mode==='kwh'?`<label class="f">Jaarverbruik</label>${numInput('kwh',s.kwh,'kWh','3500',0,100000,100)}`:''}
        ${s.mode==='eur'?`<label class="f">Jaarlijkse elektriciteitsfactuur</label>${numInput('eur',s.eur,'€','1050',0,20000,50)}<p class="hint" id="eurHint">${s.eur?`≈ ${Math.round(s.eur/EUR_PER_KWH).toLocaleString('nl-BE')} kWh per jaar`:''}</p>`:''}
        ${s.mode==='gezin'?`<label class="f">Gezinsgrootte</label><div class="chips">${[['1-2','1 tot 2 personen'],['3-4','3 tot 4 personen'],['5+','5 of meer personen']].map(([k,t])=>chip('gezin',k,t,s.gezin===k)).join('')}</div>`:''}
        </div>`; break;
    case 'bkwh':
      h=`<h2>Wat is je jaarlijks stroomverbruik?</h2><p class="sub">Je vindt dit op je jaarafrekening of via je digitale meter.</p>
        <label class="f">Jaarverbruik</label>${numInput('bkwh',b.kwh,'kWh','3500',1000,30000,100)}
        <div class="chips">${[['Klein',2500],['Gemiddeld',3500],['Groot',5000],['Warmtepomp',8000],['Alles elektrisch',12000]].map(([t,n])=>chip('bkwh',n,`${t} (${n.toLocaleString('nl-BE')} kWh)`,b.kwh===n)).join('')}</div>
        <p class="hint">Gemiddeld gezin: 3.500 kWh. Met warmtepomp: 6.000–10.000 kWh. Elektrische wagen: +3.000 kWh.</p>`; break;
    case 'bsolar':
      h=`<h2>Heb je zonnepanelen?</h2><p class="sub">Dit bepaalt welke batterijgrootte past.</p><div class="opts two">
        ${opt('bsolar','ja','Ja, ik heb zonnepanelen','','sun',b.solar===true)}
        ${opt('bsolar','nee','Nee, geen zonnepanelen','','no',b.solar===false)}</div>
        ${b.solar===true?`<div class="grid2" style="margin-top:20px">
          <div><label class="f">Aantal panelen</label>${numInput('bpanels',b.panels,'stuks','12',4,60,1)}</div>
          <div><label class="f">Vermogen per paneel</label>${numInput('bwp',b.wp,'Wp','400',200,600,10)}</div></div>
          <div class="chips">${[8,12,16,20,24].map(n=>chip('bpanels',n,`${n} panelen`,b.panels===n)).join('')}</div>
          <p class="hint" id="kwpHint">${b.panels>=4?`≈ ${(b.panels*b.wp/1000).toLocaleString('nl-BE',{maximumFractionDigits:2})} kWp`:'Weet je het vermogen niet? Laat 400 Wp staan.'}</p>`:''}`; break;
    case 'bmeter':
      h=`<h2>Heb je al een digitale meter?</h2><p class="sub">Een digitale meter is nodig voor een thuisbatterij.</p><div class="opts two">
        ${opt('bmeter','ja','Ja, digitale meter','','meter',b.meter===true)}
        ${opt('bmeter','nee','Nee, nog een analoge meter','','meter',b.meter===false)}</div>`; break;
    case 'bphase':
      h=`<h2>Welk type aansluiting heb je?</h2><p class="sub">Check je zekeringkast: enkelfasig heeft 1 hoofdzekering, driefasig 3.</p><div class="opts two">
        ${opt('bphase','single','Enkelfasig (230V)','Standaard bij de meeste woningen','plug',b.phase==='single')}
        ${opt('bphase','three','Driefasig (400V)','Vaak bij nieuwbouw of warmtepomp','plug',b.phase==='three')}</div>`; break;
    case 'bgoal':
      h=`<h2>Wat is je hoofddoel?</h2><p class="sub">Zo kiezen we de juiste batterij.</p><div class="opts two">
        ${opt('bgoal','save','Maximaal besparen','Meer eigen stroom gebruiken','goal',b.goal==='save')}
        ${opt('bgoal','backup','Backup bij stroomuitval','Nooit zonder stroom','battery',b.goal==='backup')}
        ${opt('bgoal','peak','Pieken afvlakken','Lager capaciteitstarief','plug',b.goal==='peak')}
        ${opt('bgoal','all','Alle bovenstaande','','check',b.goal==='all')}</div>`; break;
    case 'acount':
      h=`<h2>Hoeveel ruimtes wil je koelen of verwarmen?</h2><p class="sub">Elke ruimte krijgt een eigen binnenunit.</p>
        <div class="opts three">${[1,2,3,4,5,6].map(n=>opt('acount',n,n===6?'6 of meer':`${n} ${n===1?'ruimte':'ruimtes'}`,'','snow',state.airco.count===n)).join('')}</div>`; break;
    case 'arooms':
      h=`<h2>Hoe groot is elke ruimte?</h2><p class="sub">Oppervlakte in m² per ruimte.</p>
        <div class="rooms">${state.airco.rooms.map((r,i)=>`<div class="row"><b>Ruimte ${i+1}</b>${numInput('room'+i,r,'m²','20',5,150,1)}</div>`).join('')}</div>
        <p class="hint" id="roomTot">Totaal: ${state.airco.rooms.reduce((t,r)=>t+(r||0),0)} m²</p>`; break;
    case 'aiso':
      h=`<h2>Hoe goed is je woning geïsoleerd?</h2><p class="sub">Dit bepaalt het nodige vermogen.</p><div class="opts two">
        ${[['slecht','Slecht geïsoleerd','Oudere woning, enkel glas'],['gemiddeld','Gemiddeld','Dubbel glas, basisnorm'],['goed','Goed','Hoogrendementsglas, dakisolatie'],['uitstekend','Uitstekend','Nieuwbouw of BEN-woning']].map(([k,t,d])=>opt('aiso',k,t,d,'roof',state.airco.iso===k)).join('')}</div>`; break;
    case 'aheat':
      h=`<h2>Wil je ook verwarmen met je airco?</h2><p class="sub">Een split-airco kan ook als warmtepomp werken.</p><div class="opts two">
        ${opt('aheat','ja','Ja, ook verwarmen','','sun',state.airco.heat===true)}
        ${opt('aheat','nee','Nee, alleen koelen','','snow',state.airco.heat===false)}</div>`; break;
    default: return renderResult();
  }
  v.innerHTML = h + nav(valid(), lbl);
  bind();
}

function renderResult(){
  const v=$('#view'); let label, price, spec;
  if(state.product==='solar'){
    const r=calcSolar(state.solar);
    label='Richtprijs zonnepanelen'; price=r.price;
    spec=`${r.panels} panelen · ${r.kwp.toLocaleString('nl-BE',{minimumFractionDigits:2,maximumFractionDigits:2})} kWp`;
  } else if(state.product==='airco'){
    const r=calcAirco(state.airco);
    label='Richtprijs airco'; price=r.price; spec=r.spec;
  } else {
    const r=calcBattery(state.bat);
    label='Richtprijs thuisbatterij'; price=r.price;
    spec=`Thuisbatterij ${r.cap} kWh${r.backup?' met backup':''}`;
  }
  v.innerHTML = `<div class="result"><h2>Jouw richtprijs</h2>
    <div class="pricebox"><div class="lbl">${label}</div>
      <div class="price">${price?`${eur(price.low)} – ${eur(price.high)}`:'Prijs op maat'}</div>
      <div class="spec">${spec}</div></div>
    <p class="small">Indicatieve prijs incl. standaardinstallatie. De definitieve prijs volgt na een plaatsbezoek.</p>
    <div class="nav" style="justify-content:center"><button type="button" class="btn" id="restart">Opnieuw berekenen</button></div></div>`;
  $('#restart').onclick=()=>{ state.product=null; state.step=0; render(); };
}

/* ---------- Events ---------- */
function bind(){
  const s=state.solar,b=state.bat;
  document.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.k, val=el.dataset.v; let advance=false;
    switch(k){
      case 'product': state.product=val; state.step=0; return render();
      case 'roof': s.roof=val; advance=true; break;
      case 'orient': s.orient=val; advance=true; break;
      case 'surface': s.surface=+val; break;
      case 'mode': s.mode=val; break;
      case 'gezin': s.gezin=val; break;
      case 'bkwh': b.kwh=+val; break;
      case 'bsolar': b.solar = val==='ja'; if(!b.solar){b.panels=null; advance=true;} break;
      case 'bpanels': b.panels=+val; break;
      case 'bmeter': b.meter = val==='ja'; advance=true; break;
      case 'bphase': b.phase=val; advance=true; break;
      case 'bgoal': b.goal=val; advance=true; break;
      case 'acount': { const n=+val, old=state.airco.rooms; state.airco.count=n; state.airco.rooms=Array.from({length:n},(_,i)=>old[i]??20); advance=true; break; }
      case 'aiso': state.airco.iso=val; advance=true; break;
      case 'aheat': state.airco.heat = val==='ja'; advance=true; break;
    }
    render();
    if(advance) setTimeout(go,180);
  });
  const num=(id,fn)=>{const el=document.getElementById(id); if(el) el.oninput=()=>{fn(el.value===''?null:parseFloat(el.value)); refresh();};};
  num('surface',x=>{s.surface=x||0; const r=$('#surfaceRange'); if(r) r.value=Math.min(150,s.surface);});
  num('kwh',x=>s.kwh=x); num('eur',x=>s.eur=x); num('bkwh',x=>b.kwh=x);
  num('bpanels',x=>b.panels=x); num('bwp',x=>b.wp=x);
  state.airco.rooms.forEach((_,i)=>num('room'+i,x=>state.airco.rooms[i]=x||0));
  const rg=$('#surfaceRange'); if(rg) rg.oninput=()=>{s.surface=+rg.value; $('#surface').value=s.surface; refresh();};
  const back=$('#back'); if(back) back.onclick=()=>{ if(state.step===0) state.product=null; else state.step--; render(); };
  const next=$('#next'); if(next) next.onclick=go;
  document.querySelectorAll('.inp input').forEach(i=>i.onkeydown=e=>{ if(e.key==='Enter') go(); });
}
function refresh(){ // live hints zonder focus te verliezen
  const s=state.solar,b=state.bat, n=$('#next'); if(n) n.disabled=!valid();
  const pf=$('#panelsFit'); if(pf) pf.textContent=`± ${Math.floor((s.surface||0)/PANEL_M2)} panelen mogelijk`;
  const eh=$('#eurHint'); if(eh) eh.textContent=s.eur?`≈ ${Math.round(s.eur/EUR_PER_KWH).toLocaleString('nl-BE')} kWh per jaar`:'';
  const rt=$('#roomTot'); if(rt) rt.textContent=`Totaal: ${state.airco.rooms.reduce((t,r)=>t+(r||0),0)} m²`;
  const kh=$('#kwpHint'); if(kh) kh.textContent=b.panels>=4?`≈ ${(b.panels*(b.wp||0)/1000).toLocaleString('nl-BE',{maximumFractionDigits:2})} kWp`:'Weet je het vermogen niet? Laat 400 Wp staan.';
  document.querySelectorAll('.chip').forEach(c=>{ const k=c.dataset.k,v=+c.dataset.v;
    if(k==='surface') c.classList.toggle('sel',s.surface===v);
    if(k==='bkwh') c.classList.toggle('sel',b.kwh===v);
    if(k==='bpanels') c.classList.toggle('sel',b.panels===v); });
}
function go(){ if(!valid()) return; state.step++; render(); window.scrollTo({top:0,behavior:'smooth'}); }

render();
</script>
</body>
</html>
